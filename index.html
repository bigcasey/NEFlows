document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"a1f5cb87-82c8-4bc0-85f7-a6060221ec3d\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f3f2f2;color:#201e1d;font-family:Archivo,Arial,sans-serif}\na{color:#201e1d;text-decoration:none}\na:hover{color:#ec3013}\ninput:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #ec3013;outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<header style=\"background:#201e1d;color:#fff;border-bottom:4px solid #ec3013\">\n<div style=\"max-width:1280px;margin:0 auto;padding:18px 32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n<a href=\"#\" sc-camel-on-click=\"{{ goHub }}\" style=\"display:flex;gap:12px;align-items:center;color:#fff\">\n<span style=\"width:14px;height:14px;background:#ec3013\"><\u002Fspan>\n<span style=\"font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase\">Nebraska statutory process flows<\u002Fspan>\n<\u002Fa>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c9c5c3\">Draft v{{ meta.version }} · {{ meta.dateLabel }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHub }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"max-width:1280px;width:100%;box-sizing:border-box;margin:0 auto;padding:40px 32px 80px\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:end\">\n<div>\n<div style=\"font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ec3013\">Nebraska Judicial Branch<\u002Fdiv>\n<h1 style=\"font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-0.03em;margin:12px 0 0\">Case flows by court<\u002Fh1>\n<p style=\"font-size:17px;line-height:1.45;margin:16px 0 0;max-width:680px;color:#3b3735;text-wrap:pretty\">Thirty-seven statutory baselines drawn from the Nebraska Revised Statutes, the Nebraska Constitution, and the Nebraska Court Rules. Each flow sets out the steps, the actors, the authority for each step, and the decision points. Local rules and actual clerk and court practice have not yet been verified.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:2px solid #201e1d;border-bottom:2px solid #201e1d;margin-top:36px;background:#fff\">\n<sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n<div style=\"padding:16px 18px;border-right:1px solid #d6d2d0\">\n<div style=\"font-weight:800;font-size:34px;line-height:1;letter-spacing:-0.02em\">{{ st.n }}<\u002Fdiv>\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b6562;margin-top:6px\">{{ st.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:16px;align-items:center;margin-top:32px;flex-wrap:wrap\">\n<input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Filter by code, name, or phrase\" style=\"flex:1;min-width:240px;max-width:460px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid #201e1d;border-radius:0;background:#fff;color:#201e1d\">\n<span style=\"font-size:13px;color:#6b6562\">{{ matchLabel }}<\u002Fspan>\n<\u002Fdiv>\n\n<sc-for list=\"{{ courts }}\" as=\"c\" hint-placeholder-count=\"5\">\n<section style=\"margin-top:40px\">\n<div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:2px solid #201e1d;padding-bottom:10px;flex-wrap:wrap\">\n<span style=\"background:#ec3013;color:#fff;font-weight:800;font-size:13px;letter-spacing:.08em;padding:3px 8px\">{{ c.code }}<\u002Fspan>\n<h2 style=\"font-weight:800;font-size:24px;letter-spacing:-0.01em;margin:0\">{{ c.name }}<\u002Fh2>\n<span style=\"font-size:14px;color:#6b6562\">{{ c.sub }}<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6b6562\">{{ c.countLabel }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;border-left:1px solid #d6d2d0\">\n<sc-for list=\"{{ c.flows }}\" as=\"f\" hint-placeholder-count=\"6\">\n<a href=\"{{ f.href }}\" style=\"display:flex;flex-direction:column;gap:8px;padding:16px 18px 14px;background:#fff;border-right:1px solid #d6d2d0;border-bottom:1px solid #d6d2d0;min-height:118px\" style-hover=\"background:#fdecea\">\n<span style=\"display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.08em\"><span>{{ f.id }}<\u002Fspan><span style=\"color:#6b6562\">v{{ f.version }}<\u002Fspan><\u002Fspan>\n<span style=\"font-weight:700;font-size:17px;line-height:1.2;text-wrap:pretty\">{{ f.title }}<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"display:flex;gap:14px;font-size:12px;color:#6b6562\"><span>{{ f.steps }} steps<\u002Fspan><span>{{ f.dec }} decisions<\u002Fspan><\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-for>\n\n<div style=\"border-top:2px solid #201e1d;margin-top:56px;padding-top:12px;font-size:13px;line-height:1.5;color:#6b6562;max-width:900px\">{{ meta.basis }} {{ meta.convention }}<\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFlow }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"max-width:1280px;width:100%;box-sizing:border-box;margin:0 auto;padding:28px 32px 80px\">\n<div style=\"display:flex;gap:10px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap\">\n<a href=\"#\" sc-camel-on-click=\"{{ goHub }}\" style= round:#fff\"><\u002Fspan>Step<\u002Fspan>\n<span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:9px;height:9px;background:#ec3013;transform:rotate(45deg)\"><\u002Fspan>Decision<\u002Fspan>\n<span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:12px;height:12px;background:#201e1d\"><\u002Fspan>Flow ends<\u002Fspan>\n<span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:22px;border-top:2px solid #201e1d\"><\u002Fspan>Branch<\u002Fspan>\n<span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:22px;border-top:2px dashed #ec3013\"><\u002Fspan>Loop back<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position:relative;width:{{ chart.width }}px;height:{{ chart.height }}px\">\n{{ chart.edges }}\n<sc-for list=\"{{ chart.items }}\" as=\"it\" hint-placeholder-count=\"8\">\n<sc-if value=\"{{ it.band }}\">\n<div style=\"position:absolute;left:0;top:{{ it.top }}px;width:{{ chart.cardW }}px;height:20px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6b6562;padding-left:58px;box-sizing:border-box\"><span>{{ it.label }}<\u002Fspan><span style=\"flex:1;height:1px;background:#b3adaa\"><\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ it.node }}\">\n<button sc-camel-on-click=\"{{ it.onClick }}\" title=\"{{ it.action }}\" style=\"position:absolute;left:0;top:{{ it.top }}px;width:{{ chart.cardW }}px;height:{{ chart.cardH }}px;box-sizing:border-box;text-align:left;font:inherit;cursor:pointer;border-radius:0;border:2px solid {{ it.bd }};background:{{ it.bg }};color:{{ it.fg }};padding:5px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px\">\n<span style=\"display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85\"><span>{{ it.num }}<\u002Fspan><sc-if value=\"{{ it.dec }}\"><span style=\"width:7px;height:7px;background:#ec3013;transform:rotate(45deg)\"><\u002Fspan><\u002Fsc-if><\u002Fspan>\n<span style=\"font-size:14px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:sticky;top:20px\">\n<div style=\"background:#fff;border:2px solid #201e1d;padding:20px 22px 22px\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap\">\n<span style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"background:#201e1d;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:2px 7px\">{{ sel.id }}<\u002Fspan><span style=\"font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b6562\">{{ sel.phaseLabel }}<\u002Fspan><\u002Fspan>\n<span style=\"display:flex;gap:6px\">\n<button sc-camel-on-click=\"{{ sel.prev }}\" style=\"font:inherit;font-size:12px;font-weight:800;border:2px solid #201e1d;background:#fff;border-radius:0;padding:3px 9px;cursor:pointer\" style-hover=\"background:#fdecea\">Prev<\u002Fbutton>\n<button sc-camel-on-click=\"{{ sel.next }}\" style=\"font:inherit;font-size:12px;font-weight:800;border:2px solid #201e1d;background:#fff;border-radius:0;padding:3px 9px;cursor:pointer\" style-hover=\"background:#fdecea\">Next<\u002Fbutton>\n<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font-weight:800;font-size:21px;line-height:1.2;margin:12px 0 0;text-wrap:pretty\">{{ sel.action }}<\u002Fh2>\n<div style=\"font-size:13px;color:#3b3735;margin-top:8px\"><span style=\"font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6b6562\">Actor <\u002Fspan>{{ sel.actor }}<\u002Fdiv>\n\n<sc-if value=\"{{ sel.hasCond }}\">\n<div style=\"margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid #201e1d\">Conditions<\u002Fdiv>\n<sc-for list=\"{{ sel.conditions }}\" as=\"cd\">\n<div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #e4e1df;font-size:14px;line-height:1.45\"><span style=\"flex:0 0 6px;height:6px;margin-top:7px;background:#201e1d\"><\u002Fspan><span style=\"text-wrap:pretty\">{{ cd }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sel.hasDecision }}\">\n<div style=\"margin-top:16px;border:2px solid #ec3013;background:#fdecea;padding:10px 12px\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a0200c;margin-bottom:4px\">Decision and path<\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.45\">{{ sel.decision }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sel.hasNote }}\">\n<div style=\"margin-top:12px;font-size:14px;line-height:1.45;color:#3b3735\">{{ sel.note }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid #201e1d\">Where the case goes<\u002Fdiv>\n<sc-for list=\"{{ sel.nextRows }}\" as=\"nr\">\n<button sc-camel-on-click=\"{{ nr.onClick }}\" style=\"width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;font:inherit;font-size:14px;background:transparent;border:0;border-bottom:1px solid #e4e1df;border-radius:0;padding:8px 0;cursor:pointer;color:#201e1d\" style-hover=\"background:#fdecea\">\n<span style=\"flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:2px solid {{ nr.c }};color:{{ nr.c }};padding:0 5px\">{{ nr.kind }}<\u002Fspan>\n<span style=\"flex:0 0 auto;font-weight:800\">{{ nr.id }}<\u002Fspan>\n<span style=\"color:#3b3735\">{{ nr.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n\n<sc-if value=\"{{ sel.hasCits }}\">\n<div style=\"margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid #201e1d\">Authority<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.55;color:#3b3735;margin-top:8px\">{{ sel.cits }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ tabAuth }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:20px;background:#fff;border:2px solid #201e1d;overflow-x:auto\">\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px;line-height:1.4\">\n<sc-raw-thead><sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:2px solid #201e1d;font-size:11px;letter-spacing:.12em;text-transform:uppercase;width:120px\">Step<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:2px solid #201e1d;font-size:11px;letter-spacing:.12em;text-transform:uppercase\">Step it governs<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:2px solid #201e1d;font-size:11px;letter-spacing:.12em;text-transform:uppercase\">Authority<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ authRows }}\" as=\"ar\" hint-placeholder-count=\"6\">\n<sc-raw-tr>\n<sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #e4e1df;vertical-align:top;font-weight:800;white-space:nowrap\"><button sc-camel-on-click=\"{{ ar.onClick }}\" style=\"font:inherit;font-weight:800;background:transparent;border:0;padding:0;cursor:pointer;color:#201e1d;border-bottom:1px solid #201e1d\">{{ ar.id }}<\u002Fbutton><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #e4e1df;vertical-align:top;color:#3b3735\">{{ ar.label }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #e4e1df;vertical-align:top\">{{ ar.cits }}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ tabRefs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px;margin-top:24px\">\n<div>\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid #201e1d\">This flow refers to<\u002Fdiv>\n<sc-for list=\"{{ refsOut }}\" as=\"r\" hint-placeholder-count=\"3\">\n<a href=\"{{ r.href }}\" style=\"display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid #d6d2d0\" style-hover=\"background:#fdecea\"><span style=\"font-weight:800;font-size:13px;min-width:74px\">{{ r.id }}<\u002Fspan><span style=\"font-weight:700\">{{ r.title }}<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:12px;color:#6b6562\">{{ r.court }}<\u002Fspan><\u002Fa>\n<\u002Fsc-for>\n<sc-if value=\"{{ noRefsOut }}\"><p style=\"color:#6b6562;font-size:14px\">No cross-references listed.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid #201e1d\">Referred to by<\u002Fdiv>\n<sc-for list=\"{{ refsIn }}\" as=\"r\" hint-placeholder-count=\"3\">\n<a href=\"{{ r.href }}\" style=\"display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid #d6d2d0\" style-hover=\"background:#fdecea\"><span style=\"font-weight:800;font-size:13px;min-width:74px\">{{ r.id }}<\u002Fspan><span style=\"font-weight:700\">{{ r.title }}<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:12px;color:#6b6562\">{{ r.court }}<\u002Fspan><\u002Fa>\n<\u002Fsc-for>\n<sc-if value=\"{{ noRefsIn }}\"><p style=\"color:#6b6562;font-size:14px\">No other flow lists this one.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"border-top:2px solid #201e1d;margin-top:48px;padding-top:10px;font-size:13px;color:#6b6562\">Source: {{ flow.caseType }}, version {{ flow.version }}, produced {{ flow.produced }}. Statutory baseline; local rules and clerk practice not yet verified.<\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;default&quot;:&quot;Comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flow chart&quot;},&quot;showPhaseBands&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flow chart&quot;},&quot;openFlow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Start&quot;}}\">\nclass Component extends DCLogic {\n  state = { ready: !!window.NE, hash: (location.hash || '').slice(1), query: '', tab: 'flow', sel: 0, spot: null };\n  componentDidMount() {\n    this.onHash = () => this.setState({ hash: decodeURIComponent((location.hash || '').slice(1)), tab: 'flow', sel: 0, spot: null }, () => window.scrollTo(0, 0));\n    window.addEventListener('hashchange', this.onHash);\n    if (!window.NE) { this.t = setInterval(() => { if (window.NE) { clearInterval(this.t); this.setState({ ready: true }); } }, 60); }\n    const start = this.props.openFlow;\n    if (!location.hash && start && window.NE && window.NE.flows[start]) location.hash = start;\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); clearInterval(this.t); }\n\n  static COURTS = [\n    ['SC', 'Supreme Court', 'Direct appeals, bypass, further review, original actions, and attorney discipline'],\n    ['CA', 'Court of Appeals', 'Civil and criminal appeals and summary disposition'],\n    ['DC', 'District Court', 'General jurisdiction, domestic relations, felonies, and review of county court and agency decisions'],\n    ['CC', 'County Court', 'Misdemeanors, traffic, civil and small claims, probate, protection orders, and juvenile matters'],\n    ['JC', 'Separate Juvenile Court', 'Juvenile matters in counties with a separate juvenile court']\n  ];\n  title(f) { return String(f.case_type).replace(/^[A-Z]{2}-[A-Z]{4}\\s*-\\s*/, ''); }\n  courtName(id) { const c = Component.COURTS.find(c => c[0] === id.slice(0, 2)); return c ? c[1] : ''; }\n  parseNotes(n) {\n    const raw = String(n || '');\n    const spots = [...raw.matchAll(/\\[SPOTLIGHT:\\s*([^\\]]+)\\]/g)].map(m => m[1].trim());\n    const body = raw.replace(/\\[SPOTLIGHT:[^\\]]*\\]/g, '').trim();\n    const m = /^Decision point:?\\s*/i.exec(body);\n    return m ? { spots, decision: body.slice(m[0].length).replace(/^./, c => c.toUpperCase()), note: '' } : { spots, decision: '', note: body };\n  }\n  dateLabel(d) { const [y, m, dd] = String(d).split('-'); const M = ['January','February','March','April','May','June','July','August','September','October','November','December']; return (+dd) + ' ' + M[+m - 1] + ' ' + y; }\n\n  hubVals(NE) {\n    const q = this.state.query.trim().toLowerCase();\n    let shown = 0;\n    const courts = Component.COURTS.map(([code, name, sub]) => {\n      const flows = NE.order.filter(id => id.startsWith(code + '-')).map(id => {\n        const f = NE.flows[id];\n        return { id, title: this.title(f), version: f.version, steps: f.steps.length, dec: f.steps.filter(s => s.decision_point).length, href: '#' + id,\n          hay: (id + ' ' + this.title(f) + ' ' + f.labels.join(' ') + ' ' + f.steps.map(s => s.action).join(' ')).toLowerCase() };\n      }).filter(f => !q || f.hay.includes(q));\n      shown += flows.length;\n      return { code, name, sub, flows, countLabel: flows.length + (flows.length === 1 ? ' flow' : ' flows') };\n    }).filter(c => c.flows.length);\n    const all = NE.order.map(id => NE.flows[id]);\n    const stats = [\n      { n: 5, label: 'courts' }, { n: all.length, label: 'case type flows' },\n      { n: all.reduce((a, f) => a + f.steps.length, 0), label: 'process steps' },\n      { n: all.reduce((a, f) => a + f.steps.filter(s => s.decision_point).length, 0), label: 'decision points' }\n    ];\n    return { courts, stats, matchLabel: q ? shown + ' of ' + all.length + ' flows match' : '' };\n  }\n\n  flowVals(NE, id) {\n    const f = NE.flows[id], steps = f.steps, S = this.state;\n    const sel = Math.min(S.sel, steps.length - 1);\n    const idx = {}; steps.forEach((s, i) => idx[s.step_id] = i);\n    const goStep = i => () => this.setState({ sel: i, tab: 'flow' });\n    const compact = this.props.density === 'Compact';\n    const bands = this.props.showPhaseBands !== false;\n    const cardW = 300, cardH = compact ? 40 : 50, G = compact ? 14 : 20, BAND = 26;\n    const items = []; let y = 0, last = null; const pos = [];\n    steps.forEach((s, i) => {\n      if (bands && s.phase !== last) { items.push({ band: true, label: s.phase, top: y }); y += BAND; last = s.phase; }\n      const isSel = i === sel, term = !(s.next_steps || []).length;\n      const bg = isSel ? '#ec3013' : term ? '#201e1d' : '#fff';\n      const fg = isSel || term ? '#fff' : '#201e1d';\n      const bd = isSel ? '#ec3013' : '#201e1d';\n      items.push({ node: true, top: y, num: s.step_id, label: f.labels[i], action: s.action, dec: !!s.decision_point && !isSel, bg, fg, bd, onClick: goStep(i) });\n      pos[i] = y; y += cardH + G;\n    });\n    const H = y - G;\n    const edges = []; const lanes = [];\n    steps.forEach((s, i) => (s.next_steps || []).forEach(t => { const j = idx[t]; if (j == null) return; if (j === i + 1) edges.push({ seq: true, a: i, b: j }); else edges.push({ a: i, b: j }); }));\n    const jumps = edges.filter(e => !e.seq).sort((p, q) => Math.abs(p.b - p.a) - Math.abs(q.b - q.a));\n    jumps.forEach(e => { const lo = Math.min(e.a, e.b), hi = Math.max(e.a, e.b); let k = 0; while ((lanes[k] || []).some(r => !(hi < r[0] || lo > r[1]))) k++; (lanes[k] = lanes[k] || []).push([lo, hi]); e.lane = k; });\n    const width = cardW + 24 + Math.max(1, lanes.length) * 12 + 8;\n    const h = React.createElement;\n    const ports = {}; jumps.forEach((e, k) => { e.id = k; (ports[e.a] = ports[e.a] || []).push({ e, r: 's', o: e.b }); (ports[e.b] = ports[e.b] || []).push({ e, r: 't', o: e.a }); });\n    const PY = {}; for (const i in ports) { const L = ports[i], top = pos[i]; L.sort((p, q) => p.o - q.o || (p.r === 's' ? -1 : 1)); const n = L.length, t0 = top + 8, t1 = top + cardH - 8; L.forEach((p, k) => PY[p.e.id + p.r] = n === 1 ? top + cardH / 2 : t0 + (t1 - t0) * k / (n - 1)); }\n    const paths = [];\n    edges.forEach((e, k) => {\n      if (e.seq) { const x = 40, y1 = pos[e.a] + cardH, y2 = pos[e.b] - 2; paths.push(h('path', { key: 's' + k, d: `M${x} ${y1} L${x} ${y2}`, stroke: '#201e1d', strokeWidth: 2, fill: 'none', markerEnd: 'url(#neA)' })); return; }\n      const x = cardW + 14 + e.lane * 12, back = e.b < e.a;\n      const y1 = PY[e.id + 's'], y2 = PY[e.id + 't'];\n      paths.push(h('path', { key: 'j' + k, d: `M${cardW} ${y1} L${x} ${y1} L${x} ${y2} L${cardW + 4} ${y2}`, stroke: back ? '#ec3013' : '#201e1d', strokeWidth: 2, strokeDasharray: back ? '5 3' : null, fill: 'none', markerEnd: back ? 'url(#neR)' : 'url(#neA)' }));\n    });\n    const mk = (id, c) => h('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, h('path', { d: 'M0,1 L9,5 L0,9 z', fill: c }));\n    const edgesEl = h('svg', { width, height: H, style: { position: 'absolute', left: 0, top: 0, overflow: 'visible', pointerEvents: 'none' } }, h('defs', null, mk('neA', '#201e1d'), mk('neR', '#ec3013')), ...paths);\n\n    const s = steps[sel], np = this.parseNotes(s.notes);\n    const spotIds = new Set((f.spotlights || []).map(x => x.spotlight_id));\n    const openSpot = sid => () => this.setState({ tab: 'spots', spot: sid }, () => { const el = document.getElementById(sid); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 20); });\n    const nextRows = (s.next_steps || []).map(t => { const j = idx[t]; return j == null ? { kind: 'Exit', id: t, label: '', c: '#6b6562', onClick: () => {} } : { kind: j < sel ? 'Loop' : 'Next', id: t, label: f.labels[j], c: j < sel ? '#ec3013' : '#201e1d', onClick: goStep(j) }; });\n    if (!nextRows.length) nextRows.push({ kind: 'End', id: 'Flow ends', label: 'The last step on this path.', c: '#201e1d', onClick: () => {} });\n    const selV = {\n      id: s.step_id, phaseLabel: s.phase + (s.decision_point ? ', decision' : ''), action: s.action, actor: s.actor,\n      conditions: s.conditions || [], hasCond: !!(s.conditions || []).length,\n      decision: np.decision, hasDecision: !!np.decision, note: np.note, hasNote: !!np.note,\n      spots: np.spots.filter(x => spotIds.has(x)).map(x => ({ label: x.replace(/^.*-SL-/, 'Spotlight '), onClick: openSpot(x) })),\n      cits: (s.citations || []).join('; '), hasCits: !!(s.citations || []).length, nextRows,\n      prev: () => this.setState({ sel: Math.max(0, sel - 1) }), next: () => this.setState({ sel: Math.min(steps.length - 1, sel + 1) })\n    };\n    selV.hasSpots = selV.spots.length > 0;\n\n    const spotList = (f.spotlights || []).map(sp => ({ id: sp.spotlight_id, text: sp.description, bd: S.spot === sp.spotlight_id ? '#ec3013' : '#201e1d', bg: S.spot === sp.spotlight_id ? '#fdecea' : 'transparent',\n      steps: (sp.affected_steps || []).map(a => ({ id: a, onClick: idx[a] != null ? goStep(idx[a]) : () => {} })) }));\n    const authRows = steps.map((st, i) => ({ id: st.step_id, label: f.labels[i], cits: (st.citations || []).join('; ') || 'None stated', onClick: goStep(i) }));\n    const ref = r => NE.flows[r] ? { id: r, title: this.title(NE.flows[r]), court: this.courtName(r), href: '#' + r } : null;\n    const refsOut = (f.cross_references || []).map(ref).filter(Boolean);\n    const refsIn = NE.order.filter(o => o !== id && (NE.flows[o].cross_references || []).includes(id)).map(ref);\n    const phases = [...new Set(steps.map(x => x.phase))];\n    const tabDefs = [['flow', 'Flow and steps'], ['auth', 'Authority'], ['refs', 'Cross-references (' + refsOut.length + ')']];\n    return {\n      flow: { docHref: encodeURI('Nebraska Flows 20260925/' + ({ SC: '1 Supreme Court', CA: '2 Court of Appeals', DC: '3 District Court', CC: '4 County Court', JC: '5 Separate Juvenile Court' })[id.slice(0, 2)] + '/' + id + ' ' + this.title(f).replace(/[,()\\/:']/g, '').replace(/\\s+/g, ' ') + ' - Statutory Process Flow 20260925.dc.html'),\n        id, title: this.title(f), court: this.courtName(id), caseType: f.case_type, version: f.version, produced: this.dateLabel(f.produced_date),\n        facts: [{ k: 'Court', v: this.courtName(id) }, { k: 'Steps', v: steps.length }, { k: 'Decision points', v: steps.filter(x => x.decision_point).length }, { k: 'Phases', v: phases.length }, { k: 'Version', v: 'v' + f.version + ', ' + f.status }] },\n      tabs: tabDefs.map(([k, l]) => ({ label: l, bg: S.tab === k ? '#201e1d' : 'transparent', fg: S.tab === k ? '#fff' : '#201e1d', onClick: () => this.setState({ tab: k, spot: null }) })),\n      tabFlow: S.tab === 'flow', tabAuth: S.tab === 'auth', tabRefs: S.tab === 'refs',\n      chart: { width, height: H, cardW, cardH, items, edges: edgesEl }, sel: selV, spotList, authRows,\n      refsOut, refsIn, noRefsOut: !refsOut.length, noRefsIn: !refsIn.length\n    };\n  }\n\n  renderVals() {\n    const NE = window.NE;\n    const goHub = e => { if (e) e.preventDefault(); history.pushState(null, '', location.pathname + location.search); this.setState({ hash: '', tab: 'flow', sel: 0 }); window.scrollTo(0, 0); };\n    const base = { goHub, query: this.state.query, onQuery: e => this.setState({ query: e.target.value }) };\n    if (!NE) return { ...base, isHub: true, isFlow: false, meta: {}, stats: [], courts: [] };\n    const meta = { version: NE.meta.version, dateLabel: this.dateLabel(NE.meta.produced_date), basis: NE.meta.basis, convention: NE.meta.flow_id_convention };\n    const id = this.state.hash;\n    if (id && NE.flows[id]) return { ...base, meta, isHub: false, isFlow: true, ...this.flowVals(NE, id) };\n    return { ...base, meta, isHub: true, isFlow: false, ...this.hubVals(NE) };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
